spring:
  application:
    name: bank

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  environment: ${APP_ENVIRONMENT:local}
  greeting-message: ${GREETING_MESSAGE:Hello from default config}
  password: ${PASSWORD:no password}

server:
  port: ${SERVER_PORT:8080}