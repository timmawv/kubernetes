server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bank
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true


management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  environment: ${APP_ENVIRONMENT:local}
  greeting-message: ${GREETING_MESSAGE:Hello from default config}
  password: ${PASSWORD:no password}
